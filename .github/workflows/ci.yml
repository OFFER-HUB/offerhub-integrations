name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # The adapters must stand on their own: no OfferHub variables and no network.
  adapters-standalone:
    name: ${{ matrix.package }} without environment or network
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [adapter-trustlesswork, adapter-blindpay]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Test
        run: |
          cd packages/${{ matrix.package }}
          env -i PATH="$PATH" HOME="$HOME" HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 npm test

  # Both adapters installed from their packed tarballs into a blank NestJS project that has
  # nothing to do with this repository: README install commands, README examples compiled,
  # app booted, clients exercised. Needs the npm registry and the testnet RPC.
  blank-project:
    name: Adapters in a blank NestJS project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check:blank-project

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan history
        run: gitleaks git --log-opts="--all" --redact --no-banner -c .gitleaks.toml .
