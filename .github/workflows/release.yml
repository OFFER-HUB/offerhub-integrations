# Publishes an adapter package to npm when its release tag is pushed.
#
#   git tag adapter-blindpay-v0.1.3 && git push origin adapter-blindpay-v0.1.3
#   git tag adapter-trustlesswork-v0.1.3 && git push origin adapter-trustlesswork-v0.1.3
#
# The tag must match the version in the package's package.json. The job builds
# the package, runs its tests with no environment and no network, checks what
# the tarball contains, and publishes it.
#
# Authentication: npm Trusted Publishing (OIDC). No npm token is stored anywhere: each
# package on npmjs.com trusts this repository and this workflow file (release.yml), and
# GitHub issues a short-lived identity for the run (https://docs.npmjs.com/trusted-publishers).
# This repository is public, so npm records provenance: the package page links the exact
# commit and workflow run that built it.
name: Release

on:
  push:
    tags:
      - 'adapter-trustlesswork-v*'
      - 'adapter-blindpay-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to dry-run (no publish)'
        required: true
        type: choice
        options:
          - adapter-trustlesswork
          - adapter-blindpay

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) and provenance

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs Node 22.14+ and npm 11.5.1+
          node-version: '22'
          cache: 'npm'
          # No registry-url: with it, setup-node writes an .npmrc that sends a placeholder
          # NODE_AUTH_TOKEN (XXXXX-XXXXX-...), which npm uses instead of the OIDC identity
          # and the registry rejects. The default registry is already registry.npmjs.org.

      - name: Work out the package and version
        id: pkg
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            name="$INPUT_PACKAGE"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            name="${REF_NAME%-v*}"
            tag_version="${REF_NAME##*-v}"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi
          case "$name" in
            adapter-trustlesswork|adapter-blindpay) ;;
            *) echo "::error::Unknown package '$name'"; exit 1 ;;
          esac
          version=$(node -p "require('./packages/$name/package.json').version")
          if [ "${tag_version:-$version}" != "$version" ]; then
            echo "::error::Tag version ${tag_version} does not match packages/$name/package.json (${version})"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -w @offerhub-orchestrator/${{ steps.pkg.outputs.name }}

      # No OfferHub variables and no network: the suite must stand on its own
      - name: Test without environment or network
        run: |
          cd packages/${{ steps.pkg.outputs.name }}
          env -i PATH="$PATH" HOME="$HOME" HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 npm test

      - name: Check the tarball
        run: |
          cd packages/${{ steps.pkg.outputs.name }}
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('/tmp/pack.json','utf8'))[0].files.map(f => f.path);
            const bad = files.filter(f => /__tests__|\.spec\.|^src\//.test(f));
            if (bad.length) { console.error('Unexpected files in the package:', bad); process.exit(1); }
            for (const need of ['LICENSE','README.md','package.json','dist/index.js','dist/index.d.ts']) {
              if (!files.includes(need)) { console.error('Missing from the package:', need); process.exit(1); }
            }
            console.log(files.length + ' files, none unexpected');
          "

      # Only the publish step needs npm 11.5.1+ (Trusted Publishing). Upgrading before
      # `npm ci` breaks the install: npm 11 rejects this lockfile's optional platform entries.
      - name: Use an npm that supports Trusted Publishing
        if: steps.pkg.outputs.dry_run != 'true'
        run: npm install -g npm@^11.5.1

      # OIDC: no NODE_AUTH_TOKEN. npm adds provenance on its own for a public repository.
      - name: Publish
        if: steps.pkg.outputs.dry_run != 'true'
        run: npm publish -w @offerhub-orchestrator/${{ steps.pkg.outputs.name }} --access public
